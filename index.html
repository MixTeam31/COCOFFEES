<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>COCOFFEES</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main id="app">
    <video
      id="videoPlayer"
      autoplay
      muted
      playsinline
      webkit-playsinline
      preload="auto"
      aria-label="Lecteur vidéo COCOFFEES"
    ></video>

    <section id="startupScreen" aria-hidden="true">
      <div class="startup-content">
        <div class="coffee-mark">C</div>

        <h1>COCOFFEES</h1>

        <p id="startupText">
          Connexion de l'afficheur...
        </p>

        <div class="startup-progress">
          <div id="startupProgressBar"></div>
        </div>
      </div>
    </section>

    <section id="overlay" role="status" aria-live="polite">
      <div id="statusMessage">
        COCOFFEES - Chargement...
      </div>

      <button id="startButton" type="button">
        ▶ Démarrer la lecture
      </button>
    </section>

    <aside id="closingNotice" aria-live="polite">
      <strong>Fermeture COCOFFEES</strong>
      <span id="closingNoticeText"></span>
    </aside>

    <section id="remoteNotification" aria-live="assertive">
      <div class="notification-icon">!</div>
      <div>
        <strong>COCOFFEES</strong>
        <p id="remoteNotificationText"></p>
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
